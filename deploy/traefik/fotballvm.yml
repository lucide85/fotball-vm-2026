# ─────────────────────────────────────────────────────────────────────────────
# Traefik DYNAMISK config (file provider).
# Legges på TRAEFIK-VM-EN, i mappa Traefik leser dynamiske filer fra
# (typisk /etc/traefik/dynamic/). Traefik plukker den opp automatisk – ingen
# omstart nødvendig hvis file provider kjører med "watch: true".
#
# Domene vm26.vikane.cloud, app-VM 192.168.1.25:8123 (samme VM som run-appen).
#
# Sjekk at disse to stemmer med DIN Traefik (statisk config):
#   websecure    → navnet på din HTTPS-entrypoint (port 443)
#   letsencrypt  → navnet på din certificate resolver
# ─────────────────────────────────────────────────────────────────────────────

http:
  routers:
    fotballvm:
      rule: "Host(`vm26.vikane.cloud`)"
      entryPoints:
        - websecure
      service: fotballvm-svc
      tls:
        certResolver: letsencrypt

  services:
    fotballvm-svc:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://192.168.1.25:8123"
